name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Versión fija: Playwright instala sus dependencias según la versión de Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar las dependencias
        run: npm ci

      - name: Revisar el estilo (lint)
        run: npm run lint

      - name: Revisar los tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Compilar (build)
        run: npm run build

      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        run: npm run e2e

      - name: Guardar las trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-playwright
          path: test-results/
          retention-days: 7
